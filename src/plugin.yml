name: FalchusChunks
version: ${project.version}
api-version: 1.13
description: A blazingly fast chunk generator.
main: com.falchus.chunks.Main
author: Falchus
authors: [Kalibrier, Roma]
website: falchus.com/chunks

depend: [FalchusLib]

commands:
  generate:
    permission: falchus.chunks.generate
    aliases: [gen]

permissions:
  falchus.chunks.generate:
    default: op